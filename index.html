<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WAX App (Step 3 Test Mode)</title>
<style>
body {font-family: Arial; margin:20px;}
.badge {padding:6px 10px; border-radius:6px; color:white;}
.prod {background:green;}
.test {background:orange;}
button {margin:5px; padding:10px;}
</style>
</head>
<body>

<h2>WAX Dashboard</h2>

<div id="modeBadge" class="badge prod">Laufender Betrieb</div>

<h3>Pflege</h3>
<button onclick="setMode('prod')">Laufender Betrieb</button>
<button onclick="setMode('test')">Testbetrieb</button>
<button onclick="deleteTestData()">Testdaten löschen</button>

<script>
let MODE = 'prod';

function setMode(m){
  MODE = m;
  const badge = document.getElementById('modeBadge');
  if(m==='test'){
    badge.className = 'badge test';
    badge.innerText = 'Testbetrieb';
  } else {
    badge.className = 'badge prod';
    badge.innerText = 'Laufender Betrieb';
  }
  alert('Modus gewechselt: ' + MODE);
}

async function deleteTestData(){
  if(!confirm('Alle Testdaten löschen?')) return;
  alert('Testdaten gelöscht (Simulation)');
}
</script>

</body>
</html>
