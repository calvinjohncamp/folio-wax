<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio.wax</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
}

/* Login: kein Scroll */
body.login-mode {
  overflow: hidden;
}

/* Scrollbar komplett unsichtbar */
::-webkit-scrollbar {
  width: 0px;
  background: transparent;
}
</style>

</head>
<body class="login-mode">

<div id="app">
  <!-- Deine bestehende App bleibt hier unverändert -->
</div>

<script>
/* =========================
   SCROLL FIX
========================= */
function updateScroll() {
  const isLogin = document.querySelector('#login-screen');
  if (isLogin) {
    document.body.classList.add('login-mode');
  } else {
    document.body.classList.remove('login-mode');
  }
}
document.addEventListener("DOMContentLoaded", updateScroll);


/* =========================
   CACHE FIX (INLINE SW)
========================= */
if ('serviceWorker' in navigator) {

  const swCode = `
    const CACHE_NAME = 'folio-v88';

    self.addEventListener('install', e => {
      self.skipWaiting();
    });

    self.addEventListener('activate', event => {
      event.waitUntil(
        caches.keys().then(keys => Promise.all(
          keys.map(key => {
            if (key !== CACHE_NAME) return caches.delete(key);
          })
        ))
      );
      self.clients.claim();
    });

    self.addEventListener('fetch', event => {

      // HTML NIE cachen
      if (event.request.mode === 'navigate') {
        event.respondWith(fetch(event.request));
        return;
      }

      event.respondWith(
        caches.open(CACHE_NAME).then(cache => {
          return cache.match(event.request).then(res => {
            return res || fetch(event.request).then(fetchRes => {
              cache.put(event.request, fetchRes.clone());
              return fetchRes;
            });
          });
        })
      );
    });
  `;

  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swURL = URL.createObjectURL(blob);

  navigator.serviceWorker.register(swURL);
}
</script>

</body>
</html>
